<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Lyric Reader</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#000; --fg-dim:rgba(255,255,255,0.25); --fg-bright:#fff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif; overflow:hidden; }
  #setup { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; padding:24px; background:var(--bg); z-index:10; }
  #setup.hidden { display:none; }
  textarea { width:100%; max-width:480px; height:240px; background:#111; color:#fff;
    border:1px solid #333; border-radius:12px; padding:16px; font-size:16px; resize:vertical; }
  .row { display:flex; gap:12px; align-items:center; width:100%; max-width:480px; }
  input[type=range] { flex:1; }
  button { background:#fff; color:#000; border:none; border-radius:999px; padding:12px 24px;
    font-size:16px; font-weight:600; cursor:pointer; }
  button.secondary { background:#222; color:#fff; }
  #player { position:fixed; inset:0; overflow:hidden; }
  #player.hidden { display:none; }
  #lines { position:absolute; left:0; right:0; top:0; display:flex; flex-direction:column; align-items:center; gap:28px; transition:transform .4s ease; will-change:transform; }
  .line { font-size:22px; font-weight:700; line-height:1.3; color:var(--fg-dim); opacity:0.35; text-align:center; transform:scale(0.92); transition:opacity .4s ease, transform .4s ease, filter .4s ease; filter:blur(2px); }
  .line.active { color:var(--fg-bright); opacity:1; transform:scale(1); filter:blur(0); font-size:28px; }
  .line.past { opacity:0.2; }
  .word { display:inline-block; margin-right:0.28em; white-space:pre; }
  .line.active .word { background-image:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,0.3) var(--p,0%));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  #controls { position:fixed; bottom:24px; left:0; right:0; display:flex; justify-content:center; gap:16px; }
  #topbar { position:fixed; top:16px; right:16px; }
  #topbar button { padding:8px 16px; font-size:13px; }
</style>
</head>
<body>

<div id="setup">
  <h2 style="margin:0 0 8px;">Lyric Reader</h2>
  <textarea id="textInput" placeholder="Paste your text here, one line per line break..."></textarea>
  <div class="row">
    <label style="white-space:nowrap;">Speed</label>
    <input type="range" id="speed" min="80" max="400" value="180">
    <span id="speedLabel">180 wpm</span>
  </div>
  <button id="startBtn">Start</button>
</div>

<div id="player" class="hidden">
  <div id="topbar"><button class="secondary" id="editBtn">Edit</button></div>
  <div id="lines"></div>
  <div id="controls">
    <button class="secondary" id="restartBtn">Restart</button>
    <button id="playPauseBtn">Pause</button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

const setup = document.getElementById('setup');
const player = document.getElementById('player');
const textInput = document.getElementById('textInput');
const speedInput = document.getElementById('speed');
const speedLabel = document.getElementById('speedLabel');
const linesEl = document.getElementById('lines');
const startBtn = document.getElementById('startBtn');
const editBtn = document.getElementById('editBtn');
const restartBtn = document.getElementById('restartBtn');
const playPauseBtn = document.getElementById('playPauseBtn');

speedInput.addEventListener('input', () => speedLabel.textContent = speedInput.value + ' wpm');

let timeline = [], lineEls = [], wordEls = [], totalDuration = 0;
let startTs = null, pausedAt = 0, playing = false, rafId = null;
let lastActiveLine = -1;

function buildTimeline(text, wpm) {
  const lines = text.split('\n').filter(l => l.trim().length > 0);
  const msPerWord = 60000 / wpm;
  let t = 0;
  const tl = [];
  lines.forEach((line, li) => {
    const words = line.trim().split(/\s+/);
    words.forEach((w, wi) => {
      const dur = msPerWord * Math.max(0.6, Math.min(2.2, w.length / 5));
      tl.push({ lineIndex: li, wordIndex: wi, start: t, end: t + dur });
      t += dur;
    });
    t += msPerWord * 0.6;
  });
  return { lines, timeline: tl, total: t };
}

function render(lines) {
  linesEl.innerHTML = '';
  lineEls = []; wordEls = [];
  lines.forEach((line, li) => {
    const div = document.createElement('div');
    div.className = 'line';
    const words = line.trim().split(/\s+/);
    wordEls[li] = [];
    words.forEach((w) => {
      const span = document.createElement('span');
      span.className = 'word';
      span.textContent = w;
      div.appendChild(span);
      wordEls[li].push(span);
    });
    linesEl.appendChild(div);
    lineEls.push(div);
  });
}

function centerActiveLine(activeLine) {
  if (activeLine < 0 || !lineEls[activeLine]) return;
  const lineEl = lineEls[activeLine];
  const lineCenter = lineEl.offsetTop + lineEl.offsetHeight / 2;
  const viewportCenter = window.innerHeight / 2;
  linesEl.style.transform = `translateY(${viewportCenter - lineCenter}px)`;
}

function tick(now) {
  if (!playing) return;
  const elapsed = pausedAt + (now - startTs);
  let activeLine = -1;
  for (const item of timeline) {
    if (elapsed >= item.start && elapsed <= item.end) {
      const frac = Math.min(1, Math.max(0, (elapsed - item.start) / (item.end - item.start)));
      wordEls[item.lineIndex][item.wordIndex].style.setProperty('--p', (frac*100) + '%');
      activeLine = item.lineIndex;
    } else if (elapsed > item.end) {
      wordEls[item.lineIndex][item.wordIndex].style.setProperty('--p', '100%');
    }
  }
  lineEls.forEach((el, li) => {
    el.classList.toggle('active', li === activeLine);
    el.classList.toggle('past', li < activeLine);
  });
  if (activeLine !== lastActiveLine) {
    centerActiveLine(activeLine);
    lastActiveLine = activeLine;
  }
  if (elapsed >= totalDuration) {
    playing = false;
    playPauseBtn.textContent = 'Replay';
    return;
  }
  rafId = requestAnimationFrame(tick);
}

function play() {
  playing = true;
  startTs = performance.now();
  playPauseBtn.textContent = 'Pause';
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  pausedAt += performance.now() - startTs;
  playPauseBtn.textContent = 'Play';
  cancelAnimationFrame(rafId);
}

startBtn.addEventListener('click', () => {
  const text = textInput.value;
  if (!text.trim()) return;
  const built = buildTimeline(text, Number(speedInput.value));
  timeline = built.timeline;
  totalDuration = built.total;
  render(built.lines);
  setup.classList.add('hidden');
  player.classList.remove('hidden');
  pausedAt = 0;
  lastActiveLine = -1;
  play();
});

editBtn.addEventListener('click', () => {
  pause();
  player.classList.add('hidden');
  setup.classList.remove('hidden');
});

restartBtn.addEventListener('click', () => {
  cancelAnimationFrame(rafId);
  pausedAt = 0;
  lastActiveLine = -1;
  lineEls.forEach(el => el.classList.remove('active', 'past'));
  wordEls.flat().forEach(w => w && w.style.setProperty('--p', '0%'));
  play();
});

playPauseBtn.addEventListener('click', () => {
  if (playPauseBtn.textContent === 'Replay') { restartBtn.click(); return; }
  if (playing) pause(); else play();
});
</script>
</body>
</html>
